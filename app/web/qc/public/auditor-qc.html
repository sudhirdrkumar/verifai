<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auditor QC Review</title>
  <link rel="stylesheet" href="/qc/public/app.css?v=20260348">
  <style>
    body {
      margin: 0;
      font-family: "Outfit", "Segoe UI", Arial, sans-serif;
      background: #eef3f8;
      color: #1f2f46;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid #d8e2ef;
      position: sticky;
      top: 0;
      z-index: 10;
      flex-wrap: wrap;
    }
    .topbar h2 {
      margin: 0;
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      word-break: break-word;
    }
    .topbar .meta {
      color: #4d6485;
      font-size: clamp(0.75rem, 2vw, 0.8rem);
      word-break: break-word;
    }
    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      width: 100%;
    }
    .actions button {
      border: 1px solid #2b64a7;
      background: #2b64a7;
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: clamp(0.75rem, 2vw, 0.9rem);
      min-height: 36px;
      flex: 0 1 auto;
      white-space: nowrap;
    }
    .actions button.soft {
      background: #fff;
      color: #2b64a7;
    }
    .actions button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (hover: none) and (pointer: coarse) {
      .actions button {
        min-height: 44px;
        padding: 10px 14px;
      }
    }
    #qc-msg {
      margin: 0;
      padding: 8px 16px;
      min-height: 20px;
      font-size: clamp(0.8rem, 2vw, 0.95rem);
      word-break: break-word;
    }
    .layout {
      --left-pane-width: 52%;
      display: grid;
      grid-template-columns: minmax(320px, var(--left-pane-width)) 10px minmax(420px, 1fr);
      gap: 10px;
      padding: 12px;
      height: calc(100vh - 120px);
      box-sizing: border-box;
      align-items: stretch;
    }

    @media (max-width: 1200px) {
      .layout {
        --left-pane-width: 50%;
      }
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
        gap: 8px;
        padding: 8px;
      }
    }

    @media (max-width: 768px) {
      .layout {
        height: auto;
        gap: 6px;
        padding: 6px;
      }
    }

    @media (max-width: 480px) {
      .layout {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 200px);
        padding: 4px;
      }
    }
    .splitter {
      width: 10px;
      border-radius: 8px;
      background: linear-gradient(180deg, #d7e5f5, #c9dcee);
      border: 1px solid #b8cde3;
      cursor: col-resize;
      user-select: none;
      touch-action: none;
      align-self: stretch;
      position: relative;
    }
    .splitter::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 2px;
      height: 36px;
      border-radius: 2px;
      background: #6f8db2;
      box-shadow: 0 -8px 0 #6f8db2, 0 8px 0 #6f8db2;
    }
    .splitter:hover,
    .splitter.dragging {
      background: linear-gradient(180deg, #c6ddf4, #b4cfe8);
      border-color: #8fb4db;
    }
    body.qc-resizing,
    body.qc-resizing * {
      cursor: col-resize !important;
      user-select: none !important;
    }
    .panel {
      background: #fff;
      border: 1px solid #d8e2ef;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .panel-head {
      padding: clamp(8px, 2vw, 12px);
      border-bottom: 1px solid #e5ecf5;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: clamp(0.85rem, 2vw, 1rem);
    }
    .panel-body {
      padding: clamp(8px, 2vw, 12px);
      min-height: 0;
      overflow: hidden;
      word-break: break-word;
    }
    .panel-body.report-pane {
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 8px;
    }
    .conclusion-box {
      border: 1px solid #d8e2ef;
      border-radius: 10px;
      background: #f8fbff;
      padding: clamp(8px, 2vw, 10px);
      display: grid;
      gap: 6px;
      word-break: break-word;
    }
    .conclusion-box-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    .conclusion-box-head span {
      font-size: clamp(0.8rem, 2vw, 0.8rem);
      font-weight: 700;
      color: #2a456b;
    }
    .conclusion-box-head button {
      border: 1px solid #2b64a7;
      background: #fff;
      color: #1f2f46;
      border-radius: 8px;
      padding: 6px 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: clamp(0.75rem, 2vw, 0.8rem);
      min-height: 32px;
      white-space: nowrap;
    }
    #qc-conclusion-only {
      width: 100%;
      min-height: 104px;
      resize: vertical;
      border: 1px solid #c7d6e8;
      border-radius: 8px;
      padding: 8px 10px;
      font-family: "Outfit", "Segoe UI", Arial, sans-serif;
      font-size: 14px;
      color: #1f2f46;
      background: #fff;
      box-sizing: border-box;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    #qc-conclusion-only:focus {
      outline: 2px solid #9ec3f3;
      outline-offset: 0;
    }
    #report-editor {
      height: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #d6dfeb;
      border-radius: 10px;
      padding: 12px;
      background: #fff;
      word-break: break-word;
      overflow-wrap: break-word;
      box-sizing: border-box;
    }
    #report-editor:focus {
      outline: 2px solid #9ec3f3;
      outline-offset: 0;
    }

    @media (max-width: 768px) {
      #qc-conclusion-only {
        min-height: 80px;
      }
      #report-editor {
        min-height: 200px;
      }
    }

    @media (max-width: 480px) {
      #qc-conclusion-only {
        min-height: 60px;
        font-size: 13px;
      }
      #report-editor {
        min-height: 150px;
        font-size: 13px;
      }
    }

    .docs-wrap {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 6px;
      height: 100%;
      word-break: break-word;
    }
    .doc-select-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    #doc-select {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #b4c6de;
      border-radius: 8px;
      background: #fff;
      color: #1f2f46;
      font-size: clamp(0.85rem, 2vw, 0.9rem);
      min-height: 36px;
      box-sizing: border-box;
    }
    .doc-select-row button {
      border: 1px solid #b4c6de;
      background: #fff;
      color: #24558f;
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: clamp(0.75rem, 2vw, 0.8rem);
      font-weight: 600;
      min-width: auto;
      flex: 0 1 auto;
      white-space: nowrap;
      min-height: 36px;
      box-sizing: border-box;
    }
    #doc-selected-name {
      color: #587296;
      font-size: clamp(0.75rem, 2vw, 0.8rem);
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      padding: 2px 0;
    }

    @media (max-width: 1100px) {
      .doc-select-row {
        grid-template-columns: 1fr 1fr 1fr 1fr;
      }
      .doc-select-row button {
        min-width: 0;
      }
    }

    @media (max-width: 768px) {
      .doc-select-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
      .doc-select-row button {
        width: 100%;
        min-height: 40px;
      }
    }

    @media (max-width: 480px) {
      .docs-wrap {
        gap: 4px;
      }
      .doc-select-row {
        gap: 4px;
      }
      #doc-select {
        min-height: 40px;
        font-size: 14px;
      }
    }
    #doc-preview-container { width: 100%; height: 100%; border: 1px solid #d6dfeb; border-radius: 10px; background: #fff; overflow: hidden; }
    #doc-preview { width: 100%; height: 100%; border: 0; background: #fff; }
    #doc-preview-container:fullscreen { border-radius: 0; border: 0; background: #0b1220; }
    #doc-preview-container:fullscreen #doc-preview { width: 100vw; height: 100vh; }
    .muted-small { color: #587296; font-size: 12px; }
    .qc-confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 22, 39, 0.56);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 16px;
      box-sizing: border-box;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .qc-confirm-overlay.open {
      display: flex;
    }
    .qc-confirm-card {
      width: min(540px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #fff;
      border: 1px solid #d8e2ef;
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(16, 33, 55, 0.25);
      padding: clamp(12px, 3vw, 16px);
      display: grid;
      gap: 10px;
      word-break: break-word;
    }
    .qc-confirm-card h3 {
      margin: 0;
      font-size: clamp(1rem, 4vw, 1.2rem);
      color: #1f2f46;
    }
    .qc-confirm-card p {
      margin: 0;
      color: #365072;
      line-height: 1.45;
      word-break: break-word;
      font-size: clamp(0.85rem, 2vw, 0.95rem);
    }
    .qc-confirm-field {
      display: grid;
      gap: 6px;
      margin-top: 2px;
    }
    .qc-confirm-field label {
      font-size: clamp(0.8rem, 2vw, 0.85rem);
      color: #365072;
      font-weight: 600;
    }
    .qc-confirm-field select {
      border: 1px solid #b4c6de;
      border-radius: 8px;
      padding: 10px 10px;
      font-size: clamp(0.9rem, 2vw, 0.95rem);
      color: #1f2f46;
      background: #fff;
      width: 100%;
      min-height: 40px;
      box-sizing: border-box;
    }
    .qc-confirm-msg {
      min-height: 18px;
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      color: #587296;
      word-break: break-word;
    }
    .qc-confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .qc-confirm-actions button {
      border: 1px solid #2b64a7;
      background: #2b64a7;
      color: #fff;
      border-radius: 8px;
      padding: 8px 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
      min-height: 36px;
      flex: 0 1 auto;
    }
    .qc-confirm-actions button.soft {
      background: #fff;
      color: #2b64a7;
    }
    .qc-confirm-actions button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @media (max-width: 1100px) {
      .layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      .splitter {
        display: none;
      }
      .panel {
        min-height: 420px;
      }
    }

    @media (max-width: 768px) {
      .topbar {
        padding: 8px 12px;
      }
      .actions {
        gap: 4px;
      }
      .actions button {
        padding: 6px 8px;
        min-height: 32px;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        padding: 6px 10px;
        flex-direction: column;
        align-items: flex-start;
      }
      .topbar h2 {
        font-size: 1rem;
        margin-bottom: 4px;
        width: 100%;
      }
      .actions {
        width: 100%;
        gap: 4px;
      }
      .actions button {
        flex: 1 1 calc(50% - 2px);
        padding: 6px 4px;
        font-size: 0.7rem;
        min-height: 36px;
      }
      .panel {
        min-height: auto;
      }
      .qc-confirm-card {
        padding: 12px;
      }
      .qc-confirm-actions {
        flex-direction: column;
        gap: 6px;
      }
      .qc-confirm-actions button {
        width: 100%;
        min-height: 40px;
      }
    }
  </style>
  <script>window.learningToolsRuntime = window.learningToolsRuntime || {};</script>
</head>
<body>
  <header class="topbar">
    <div>
      <h2>Auditor QC Review</h2>
      <div class="meta" id="qc-claim-meta">Claim: -</div>
    </div>
    <div class="actions">
      <button type="button" class="soft" id="qc-reload-btn">Reload</button>
      <button type="button" class="soft" id="qc-send-back-btn">Send Back</button>
      <button type="button" class="soft" id="qc-run-rules-btn">Run Rules Again</button>
      <button type="button" class="soft" id="qc-generate-conclusion-btn">Generate Conclusion Only</button>
      <button type="button" id="qc-save-btn">Save HTML</button>
      <button type="button" id="qc-save-mark-btn">Save + Mark QC Done</button>
    </div>
  </header>
  <p id="qc-msg"></p>
  <main class="layout" id="qc-layout">
    <section class="panel">
      <div class="panel-head">
        <span>Doctor HTML</span>
        <span class="muted-small" id="qc-report-source">source: doctor</span>
      </div>
      <div class="panel-body report-pane">
        <div class="conclusion-box">
          <div class="conclusion-box-head">
            <span>Conclusion Only</span>
            <button type="button" id="qc-apply-conclusion-btn">Apply To Report</button>
          </div>
          <textarea id="qc-conclusion-only" placeholder="Run rules again or generate conclusion only..."></textarea>
        </div>
        <div id="report-editor" contenteditable="true"></div>
      </div>
    </section>
    <div id="qc-splitter" class="splitter" role="separator" aria-label="Resize panels" aria-orientation="vertical" tabindex="0"></div>
    <aside class="panel">
      <div class="panel-head">
        <span>Documents</span>
        <span class="muted-small" id="qc-doc-count">0</span>
      </div>
      <div class="panel-body docs-wrap">
        <div class="doc-select-row">
          <select id="doc-select">
            <option value="">Select document</option>
          </select>
          <button type="button" id="doc-preview-btn">Preview</button>
          <button type="button" id="doc-open-btn">Open</button>
          <button type="button" id="doc-fullscreen-btn">Full Screen</button>
        </div>
        <div class="muted-small" id="doc-selected-name">No document selected.</div>
        <div id="doc-preview-container"><iframe id="doc-preview" title="Document Preview"></iframe></div>
      </div>
    </aside>
  </main>
  <div id="qc-confirm-overlay" class="qc-confirm-overlay" aria-hidden="true">
    <div class="qc-confirm-card" role="dialog" aria-modal="true" aria-labelledby="qc-confirm-title">
      <h3 id="qc-confirm-title">Save + Mark QC Done</h3>
      <p>Please select auditor rating before continuing.</p>
      <div class="qc-confirm-field">
        <label for="qc-confirm-rating">Auditor Rating</label>
        <select id="qc-confirm-rating">
          <option value="0">Select rating</option>
          <option value="1">1 star</option>
          <option value="2">2 stars</option>
          <option value="3">3 stars</option>
          <option value="4">4 stars</option>
          <option value="5">5 stars</option>
        </select>
      </div>
      <p id="qc-confirm-msg" class="qc-confirm-msg">Select rating 1 to 5 to continue.</p>
      <div class="qc-confirm-actions">
        <button type="button" class="soft" id="qc-confirm-cancel-btn">Cancel</button>
        <button type="button" id="qc-confirm-proceed-btn">Save + QC + Rating</button>
      </div>
    </div>
  </div>
  <script src="/qc/public/auditor-qc.js?v=20260816a"></script>
</body>
</html>
