<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VerifAI Report Editor</title>
  <style>
    :root {
      --bg: #eef3f8;
      --card: #ffffff;
      --line: #d8e2ef;
      --line-soft: #e5ecf5;
      --text: #1f2f46;
      --muted: #587296;
      --brand: #2b64a7;
      --ok: #0f7a2a;
      --err: #b42318;
    }

    body {
      margin: 0;
      font-family: "Outfit", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      word-break: break-word;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: clamp(8px, 2vw, 12px) clamp(10px, 2vw, 14px);
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      word-break: break-word;
    }

    .title {
      font-size: clamp(0.95rem, 3vw, 1.05rem);
      font-weight: 700;
      margin-right: auto;
      min-width: auto;
      word-break: break-word;
    }

    .version-picker {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      font-weight: 600;
      color: var(--muted);
      flex: 0 1 auto;
    }

    .version-picker select {
      width: min(360px, 50vw);
      min-height: 36px;
      border: 1px solid #b4c6de;
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 6px 8px;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
      box-sizing: border-box;
    }

    .btn {
      border: 1px solid var(--brand);
      background: var(--brand);
      color: #fff;
      border-radius: 8px;
      padding: 7px 12px;
      font-weight: 600;
      cursor: pointer;
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      min-height: 36px;
      flex: 0 1 auto;
      white-space: nowrap;
      box-sizing: border-box;
    }

    .btn.soft {
      background: #fff;
      color: var(--brand);
      border-color: #b4c6de;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #save-status {
      width: 100%;
      font-size: clamp(0.7rem, 1.5vw, 0.8rem);
      color: var(--muted);
      min-height: 18px;
      padding-top: 2px;
      word-break: break-word;
    }

    #save-status.ok {
      color: var(--ok);
    }
    #save-status.err {
      color: var(--err);
    }

    @media (hover: none) and (pointer: coarse) {
      .btn, .version-picker select {
        min-height: 44px;
        padding: 10px 14px;
      }
    }

    .layout {
      --left-pane: 38%;
      display: grid;
      grid-template-columns: minmax(260px, var(--left-pane)) 8px minmax(360px, 1fr);
      gap: 8px;
      padding: 10px;
      height: calc(100vh - 84px);
      box-sizing: border-box;
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: minmax(220px, 0.95fr) 8px minmax(360px, 1.55fr);
        gap: 8px;
        padding: 8px;
      }
    }

    @media (max-width: 860px) {
      body {
        overflow: auto;
      }
      .layout {
        grid-template-columns: 1fr;
        height: auto;
        gap: 6px;
        padding: 6px;
      }
    }

    @media (max-width: 480px) {
      .layout {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 180px);
        padding: 4px;
      }
    }

    .pane-resizer {
      border-radius: 8px;
      background: linear-gradient(180deg, #d8e4f3 0%, #c3d4ea 100%);
      border: 1px solid #b3c7e0;
      cursor: col-resize;
      min-height: 120px;
      user-select: none;
      touch-action: none;
      position: relative;
    }

    .pane-resizer::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      height: 40px;
      transform: translate(-50%, -50%);
      background: #7ea0c8;
      border-radius: 3px;
      box-shadow: 0 -8px 0 #7ea0c8, 0 8px 0 #7ea0c8;
    }

    .pane-resizer:hover,
    .pane-resizer.is-dragging {
      background: linear-gradient(180deg, #cadef5 0%, #aec6e5 100%);
    }

    @media (max-width: 860px) {
      .pane-resizer {
        display: none;
      }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      word-break: break-word;
    }

    @media (max-width: 860px) {
      .panel {
        min-height: 420px;
      }
    }

    .panel-head {
      padding: clamp(8px, 2vw, 12px);
      border-bottom: 1px solid var(--line-soft);
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      font-size: clamp(0.85rem, 2vw, 1rem);
      word-break: break-word;
    }

    .panel-body {
      padding: clamp(8px, 2vw, 12px);
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      word-break: break-word;
    }

    .muted-small {
      color: var(--muted);
      font-size: clamp(0.75rem, 2vw, 0.8rem);
      word-break: break-word;
    }

    #report-editor {
      flex: 1;
      min-height: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid #d6dfeb;
      border-radius: 10px;
      padding: clamp(8px, 2vw, 12px);
      background: #fff;
      outline: none;
      font-size: clamp(0.9rem, 2vw, 0.95rem);
      line-height: 1.45;
      word-break: break-word;
      overflow-wrap: break-word;
      box-sizing: border-box;
    }

    #report-editor:focus {
      outline: 2px solid #9ec3f3;
      outline-offset: 0;
    }

    @media (max-width: 768px) {
      #report-editor {
        min-height: 200px;
      }
    }

    @media (max-width: 480px) {
      #report-editor {
        min-height: 150px;
        font-size: 14px;
      }
    }

    .editor-tabs {
      display: flex;
      gap: 6px;
      border-bottom: 2px solid #e0e6ed;
      padding: 0 clamp(8px, 2vw, 12px);
      margin-bottom: 8px;
      flex-wrap: wrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .editor-tabs button {
      padding: 8px 12px;
      border: none;
      background: none;
      color: #999;
      cursor: pointer;
      font-weight: 500;
      border-bottom: 3px solid transparent;
      transition: all 0.3s;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
      white-space: nowrap;
      flex: 0 1 auto;
    }

    .editor-tabs button:hover {
      color: #666;
    }
    .editor-tabs button.active {
      color: #2b64a7;
      border-bottom-color: #2b64a7;
    }

    @media (max-width: 480px) {
      .editor-tabs button {
        padding: 6px 8px;
        font-size: 0.75rem;
      }
    }

    .tab-pane {
      display: none;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      flex-direction: column;
    }

    .tab-pane.active { display: flex; }

    .phase5-pane {
      padding: clamp(8px, 2vw, 12px);
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      word-break: break-word;
    }

    .phase5-generate-btn {
      background: #2b64a7;
      color: white;
      padding: clamp(8px, 2vw, 12px) clamp(14px, 3vw, 20px);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: clamp(8px, 2vw, 12px);
      width: 100%;
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      min-height: 40px;
      box-sizing: border-box;
    }

    .phase5-result {
      background: white;
      border: 1px solid #d6dfeb;
      border-radius: 10px;
      padding: clamp(8px, 2vw, 12px);
      margin-bottom: clamp(8px, 2vw, 12px);
      word-break: break-word;
    }

    .phase5-conclusion {
      background: #fafbfc;
      padding: clamp(8px, 2vw, 12px);
      border-radius: 6px;
      margin-bottom: clamp(8px, 2vw, 12px);
      line-height: 1.6;
      max-height: 300px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      word-break: break-word;
      font-size: clamp(0.85rem, 2vw, 0.9rem);
    }

    .phase5-confidence {
      font-size: clamp(0.75rem, 2vw, 0.8rem);
      color: #666;
      margin-bottom: clamp(8px, 2vw, 12px);
      word-break: break-word;
    }

    .phase5-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .phase5-buttons button {
      flex: 1;
      min-width: 80px;
      padding: 8px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      min-height: 36px;
      box-sizing: border-box;
    }

    .phase5-approve {
      background: #28a745;
      color: white;
    }
    .phase5-edit {
      background: #ffc107;
      color: #333;
    }
    .phase5-custom {
      background: #6c757d;
      color: white;
    }

    @media (max-width: 480px) {
      .phase5-buttons button {
        flex: 1 1 100%;
        min-width: 100%;
      }
    }

    .docs-wrap {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 6px;
      height: 100%;
      word-break: break-word;
    }

    .doc-select-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    #doc-select {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid #b4c6de;
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      font-size: clamp(0.85rem, 2vw, 0.9rem);
      min-height: 36px;
      box-sizing: border-box;
    }

    .doc-select-row .btn {
      border-color: #b4c6de;
      background: #fff;
      color: #24558f;
      min-width: auto;
      padding: 7px 10px;
      font-size: clamp(0.75rem, 2vw, 0.8rem);
      flex: 0 1 auto;
      white-space: nowrap;
    }

    #doc-selected-name {
      color: var(--muted);
      font-size: clamp(0.75rem, 2vw, 0.8rem);
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      padding: 2px 0;
    }

    @media (max-width: 860px) {
      .doc-select-row {
        grid-template-columns: 1fr 1fr 1fr 1fr;
      }
      .doc-select-row .btn {
        min-width: 0;
      }
    }

    @media (max-width: 480px) {
      .doc-select-row {
        grid-template-columns: 1fr;
        gap: 4px;
      }
      .doc-select-row .btn {
        width: 100%;
      }
      #doc-select {
        min-height: 40px;
        font-size: 14px;
      }
    }

    #doc-preview-container {
      width: 100%;
      height: 100%;
      border: 1px solid #d6dfeb;
      border-radius: 10px;
      background: #fff;
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
    }

    #doc-preview {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    #doc-preview-container:fullscreen {
      border-radius: 0;
      border: 0;
      background: #0b1220;
    }

    #doc-preview-container:fullscreen #doc-preview {
      width: 100vw;
      height: 100vh;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      word-break: break-word;
    }
    th, td {
      border: 1px solid #222;
      padding: clamp(6px, 1.5vw, 8px);
      vertical-align: top;
      font-size: clamp(0.8rem, 2vw, 0.9rem);
      word-break: break-word;
    }
    th {
      text-align: left;
      background: #f0d9d2;
      width: auto;
      min-width: 140px;
    }

    @media (max-width: 768px) {
      .topbar {
        padding: 6px 10px;
      }
      .btn {
        padding: 6px 10px;
        min-height: 34px;
      }
    }

    @media (max-width: 480px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .title {
        width: 100%;
        margin-bottom: 4px;
      }
      .version-picker {
        width: 100%;
        gap: 2px;
      }
      .version-picker select {
        flex: 1;
      }
      .btn {
        font-size: 0.75rem;
        padding: 6px 8px;
        flex: 1 1 calc(50% - 2px);
      }
    }

    @media print {
      .topbar, .docs-panel {
        display: none;
      }
      body {
        overflow: visible;
        background: #fff;
      }
      .layout {
        display: block;
        height: auto;
        padding: 0;
      }
      .panel {
        border: 0;
        border-radius: 0;
      }
      .panel-body {
        padding: 0;
      }
      #report-editor {
        padding: 0;
        min-height: auto;
        border: 0;
        border-radius: 0;
      }
    }
  </style>
  <script>window.learningToolsRuntime = window.learningToolsRuntime || {};</script>
</head>
<body>
  <div class="topbar">
    <span class="title" id="report-title">Claim Report</span>
    <label class="version-picker" for="report-version-select">Version
      <select id="report-version-select" disabled><option value="">Loading versions...</option></select>
    </label>
    <button id="grammar-check-btn" class="btn soft" type="button">Grammar Check</button>
    <button id="save-report-btn" class="btn" type="button">Save Report</button>
    <button id="save-complete-btn" class="btn" type="button">Save + Completed</button>
    <button id="reload-draft-btn" class="btn soft" type="button">Reload Draft</button>
    <span id="save-status"></span>
  </div>

  <main class="layout" id="editor-layout">
    <section class="panel report-panel">
      <div class="panel-head">
        <span>Report HTML</span>
        <span class="muted-small" id="report-meta">editable</span>
      </div>
      <div class="panel-body" style="flex-direction: column;">
        <div class="editor-tabs">
          <button class="active" data-tab="manual" onclick="window.__phase5.switchTab('manual')">✎ Manual Editor</button>
          <button data-tab="phase5" onclick="window.__phase5.switchTab('phase5')">🤖 ML Generator</button>
        </div>

        <div id="manual-tab" class="tab-pane active">
          <div id="report-editor" contenteditable="true" style="flex: 1; overflow: auto;"><p style="color:#8a94a6;">Loading report...</p></div>
        </div>

        <div id="phase5-tab" class="tab-pane">
          <div class="phase5-pane">
            <button class="phase5-generate-btn" onclick="window.__phase5.generate()">⚙️ Generate Conclusion</button>
            <div id="phase5-content"></div>
          </div>
        </div>
      </div>
    </section>

    <div id="pane-resizer" class="pane-resizer" role="separator" aria-label="Resize panels" aria-orientation="vertical" tabindex="0"></div>

    <aside class="panel docs-panel">
      <div class="panel-head">
        <span>Documents</span>
        <span class="muted-small" id="doc-count">0</span>
      </div>
      <div class="panel-body docs-wrap">
        <div class="doc-select-row">
          <select id="doc-select">
            <option value="">Select document</option>
          </select>
          <button type="button" class="btn soft" id="doc-preview-btn">Preview</button>
          <button type="button" class="btn soft" id="doc-open-btn">Open</button>
          <button type="button" class="btn soft" id="doc-fullscreen-btn">Full Screen</button>
        </div>
        <div class="muted-small" id="doc-selected-name">No document selected.</div>
        <div id="doc-preview-container"><iframe id="doc-preview" title="Document Preview"></iframe></div>
      </div>
    </aside>
  </main>

  <script src="/qc/public/report-editor.js?v=20260816a"></script>
</body>
</html>
